spring.application.name=aranthangi-mart-api
server.port=8080

# Default: in-memory H2 for local dev. To use a real database, set these env vars:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# e.g. jdbc:postgresql://db-host:5432/aranthangimart  or  jdbc:mysql://db-host:3306/aranthangimart
# (the JDBC driver is picked from the URL; PostgreSQL and MySQL drivers are bundled)
spring.datasource.url=jdbc:h2:mem:aranthangimart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# update = auto-create/alter tables. Use DDL_AUTO=validate once you manage the schema yourself.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

server.error.include-message=always

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Store settings (override with environment variables, e.g. MART_DELIVERY_FEE=40)
mart.name=Aranthangi Mart
mart.tagline=Fresh groceries from Aranthangi, delivered to your door
mart.delivery.fee=30
mart.delivery.free-above=499
mart.cors.allowed-origins=http://localhost:4200
